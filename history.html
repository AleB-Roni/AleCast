<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AleCast Verlauf</title>
<style>
:root{--bg:#0f1113;--panel:#17191c;--panel2:#1f2226;--line:#2a2e33;--text:#e6e8ea;--muted:#8b9299;--accent:#ff8a3d;--rec:#2f6fd0;--act:#ffb347}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0 6px 0 0;white-space:nowrap}h1 b{color:var(--accent)}
select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#1a1006;border-color:var(--accent);font-weight:600}
.muted{color:var(--muted);font-size:12px}
.grow{flex:1}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px}
.left{min-width:0;display:flex;flex-direction:column;padding:14px;gap:10px;overflow:auto}
.vwrap{position:relative;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden}
video{display:block;width:100%;aspect-ratio:16/9;max-height:70vh;background:#000}
.badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);padding:4px 9px;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.badge small{font-weight:400;color:var(--muted);margin-left:6px}
.badge em{display:none;font-style:normal;margin-left:8px;background:#e53935;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.5px}
#liveImg{display:none;width:100%;aspect-ratio:16/9;max-height:70vh;object-fit:contain;background:#000}
#live.on{background:#e53935;border-color:#e53935;color:#fff}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tlhead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
#tlWrap{flex:1;overflow-y:auto;position:relative;overscroll-behavior:contain}
#tl{position:relative;cursor:pointer;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--line) calc(var(--hour) - 1px),var(--line) var(--hour));}
.hr{position:absolute;left:6px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums;pointer-events:none}
.seg{position:absolute;left:52px;width:12px;background:var(--rec);border-radius:2px;pointer-events:none}
.seg.cur{background:var(--accent)}
#act{position:absolute;left:70px;top:0;pointer-events:none}
.cursor{position:absolute;left:0;right:0;height:2px;background:#fff;pointer-events:none;box-shadow:0 0 6px rgba(255,255,255,.6)}
.cursor span{position:absolute;right:6px;top:-10px;background:#fff;color:#000;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.now{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--accent);pointer-events:none}
.now span{position:absolute;left:6px;top:-9px;font-size:10px;color:var(--accent);background:var(--panel);padding:0 4px}
#prev{position:fixed;z-index:10;pointer-events:none;display:none;background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#prev img{display:block;width:200px;min-height:20px}
#prev div{padding:3px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;padding:6px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
@media (max-width:900px){
  body{display:block;height:auto}
  main{display:block}
  .left{overflow:visible;padding:8px 8px 4px;gap:6px}
  aside{border-left:0;border-top:1px solid var(--line);height:58vh}
  header{padding:8px;gap:6px}
  header h1{display:none}
  header .muted{display:none}
  .kbd,#jump,#dl{display:none}
  .bar button,.bar select{padding:6px 8px}
  video,#liveImg{max-height:40vh}
}
</style>
</head>
<body>
<header>
  <h1><b>Ale</b>Cast · Verlauf</h1>
  <select id="cam" title="Kamera"></select>
  <button id="dPrev" title="Vorheriger Tag">◀</button>
  <select id="day" title="Tag"></select>
  <button id="dNext" title="Nächster Tag">▶</button>
  <button id="live" title="Live-Bild vom Handy">● LIVE</button>
  <span class="grow"></span>
  <span class="muted" id="disk"></span>
  <a href="./">Steuerung</a>
</header>
<main>
  <section class="left">
    <div id="empty" class="empty" style="display:none">Noch keine Aufnahmen. Sobald AleCorder Segmente hochlädt, erscheinen sie hier.</div>
    <div class="vwrap" id="vwrap">
      <video id="v" playsinline muted preload="auto"></video>
      <img id="liveImg" alt="Live-Bild">
      <div class="badge" id="badge">--:--:--<small id="badgeDate"></small><em id="liveTag">● LIVE</em></div>
    </div>
    <div class="bar">
      <button id="play" style="min-width:90px">▶ Abspielen</button>
      <button data-skip="-60">−1 min</button>
      <button data-skip="-10">−10 s</button>
      <button data-skip="10">+10 s</button>
      <button data-skip="60">+1 min</button>
      <select id="speed" title="Geschwindigkeit"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select>
      <button id="fs" title="Vollbild">⛶</button>
      <span class="grow"></span>
      <input type="time" id="jump" step="1" title="Zu Uhrzeit springen" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:inherit">
      <a id="dl" href="#" download class="muted">Segment ⇩</a>
    </div>
    <div class="muted" id="info"></div>
    <div class="muted kbd">Tasten: Leertaste = Pause · ←/→ = 10 s · Umschalt+←/→ = 1 min · Zeitstrahl antippen = springen · ● LIVE = aktuelles Handybild</div>
  </section>
  <aside>
    <div class="tlhead">
      <span class="muted grow">Zeitstrahl</span>
      <button id="zOut" title="Herauszoomen">−</button>
      <button id="zIn" title="Hineinzoomen">+</button>
    </div>
    <div id="tlWrap"><div id="tl"><canvas id="act" width="60"></canvas></div></div>
    <div class="legend"><span><i style="background:var(--rec)"></i>Aufnahme</span><span><i style="background:var(--act)"></i>Bewegung</span><span><i style="background:var(--accent)"></i>läuft</span></div>
  </aside>
</main>
<div id="prev"><img id="prevImg" alt=""><div id="prevTime"></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id), v=$("v"), tl=$("tl"), wrap=$("tlWrap");
const DAY=86400000, ZOOMS=[0.5,1,2,4,6];
let liveMode=false, liveTimer=null, loadedDay="";
let days=[], segs=[], cur=-1, dayStart=0, zoom=2, follow=false, lastUserScroll=0, progScroll=false, lastHash=0, pending=null;
const pad=n=>String(n).padStart(2,"0");
const hms=ms=>{const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())};
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pxMin=()=>ZOOMS[zoom];
const dayPx=()=>1440*pxMin();
const yOf=t=>(dayStart+DAY-t)/60000*pxMin();          // oben = 24:00, unten = 00:00
const tOf=y=>dayStart+DAY-y/pxMin()*60000;
const nowT=()=>liveMode?Date.now():(cur>=0?segs[cur].start+v.currentTime*1000:null);
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1600)}
async function j(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(await r.text());return r.json()}

/* ---------- Laden ---------- */
async function init(){
  const o=await j("api/recordings");
  $("disk").innerHTML=`Aufbewahrung ${o.retain_days>0?o.retain_days+" Tage":"unbegrenzt"} (<a href="./#settings">ändern</a>) · ${o.disk_free_gb} GB frei`;
  if(!o.cameras.length){$("empty").style.display="block";$("vwrap").style.display="none";return}
  days=withToday(o.days);
  $("cam").innerHTML=o.cameras.map(c=>`<option>${c}</option>`).join("");
  $("day").innerHTML=days.map(d=>`<option>${d}</option>`).join("");
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("cam")&&o.cameras.includes(h.get("cam")))$("cam").value=h.get("cam");
  let t=+h.get("t")||0;
  if(t&&days.includes(ymd(new Date(t))))$("day").value=ymd(new Date(t)); else t=0;
  if(t) await loadDay(t);
  else if(!(await goLive())) await loadDay(null);
}
function withToday(list){const t=ymd(new Date());return list.includes(t)?list:[t,...list]}
async function loadDay(target,noSeek){
  const cam=$("cam").value, day=$("day").value;
  loadedDay=day;
  segs=await j(`api/recordings?camera=${encodeURIComponent(cam)}&date=${day}`);
  const [y,m,d]=day.split("-").map(Number); dayStart=new Date(y,m-1,d).getTime();
  cur=-1; draw();
  $("info").textContent=`${segs.length} Segmente · ${fmtDur(segs.reduce((a,s)=>a+s.dur,0))} aufgenommen`;
  if(noSeek){}
  else if(target) seekTo(target,false);
  else if(segs.length){ const last=segs[segs.length-1]; seekTo(day===ymd(new Date())?Math.max(last.start,last.start+last.dur-15000):segs[0].start,false) }
  updateDayButtons();
}
function fmtDur(ms){const m=Math.round(ms/60000);return m<60?m+" min":Math.floor(m/60)+" h "+pad(m%60)+" min"}
function updateDayButtons(){const i=days.indexOf($("day").value);$("dPrev").disabled=i<0||i>=days.length-1;$("dNext").disabled=i<=0}

/* ---------- Zeitstrahl zeichnen ---------- */
function draw(center=true){
  const H=dayPx();
  tl.style.height=H+"px"; tl.style.setProperty("--hour",(60*pxMin())+"px");
  tl.querySelectorAll(".hr,.seg,.now,.cursor").forEach(e=>e.remove());
  const step=pxMin()<1?3:1;
  for(let h=0;h<=24;h+=step){const e=document.createElement("div");e.className="hr";e.style.top=Math.min(H-6,Math.max(6,yOf(dayStart+h*3600000)))+"px";e.textContent=pad(h%24)+":00";tl.appendChild(e)}
  const frag=document.createDocumentFragment();
  segs.forEach((s,i)=>{const e=document.createElement("div");e.className="seg";e.dataset.i=i;
    e.style.top=yOf(s.start+s.dur)+"px";e.style.height=Math.max(1,s.dur/60000*pxMin())+"px";frag.appendChild(e)});
  tl.appendChild(frag);
  if(ymd(new Date())===$("day").value){const n=document.createElement("div");n.className="now";n.style.top=yOf(Date.now())+"px";n.innerHTML="<span>jetzt</span>";tl.appendChild(n)}
  const c=document.createElement("div");c.className="cursor";c.id="cursor";c.style.display="none";c.innerHTML="<span></span>";tl.appendChild(c);
  drawActivity(); markCurrent(); updateCursor(center);
}
function drawActivity(){
  const cv=$("act"), H=dayPx(); cv.height=H; cv.style.height=H+"px"; cv.width=200; cv.style.width="200px";
  const g=cv.getContext("2d"); g.clearRect(0,0,cv.width,H);
  const W=Math.max(40,wrap.clientWidth-80);
  cv.width=W; cv.style.width=W+"px";
  const css=getComputedStyle(document.documentElement).getPropertyValue("--act").trim()||"#ffb347";
  g.fillStyle=css;
  for(const s of segs){ if(!s.motion)continue;
    s.motion.forEach((v0,i)=>{ if(v0<0.004)return;
      const t0=s.start+i*s.mb, y=yOf(t0+s.mb), h=Math.max(1,s.mb/60000*pxMin());
      const w=Math.max(2,Math.min(1,Math.sqrt(v0/0.05))*W);
      g.globalAlpha=0.35+0.65*Math.min(1,v0/0.05); g.fillRect(0,y,w,h)});
  }
  g.globalAlpha=1;
}
function markCurrent(){tl.querySelectorAll(".seg.cur").forEach(e=>e.classList.remove("cur"));if(cur>=0){const e=tl.querySelector(`.seg[data-i="${cur}"]`);if(e)e.classList.add("cur")}}
function updateCursor(center){
  const t=nowT(), c=$("cursor"); if(!c)return;
  if(t==null){c.style.display="none";return}
  c.style.display="block"; c.style.top=yOf(t)+"px"; c.querySelector("span").textContent=(liveMode?"LIVE ":"")+hms(t);
  $("badge").firstChild.nodeValue=hms(t); $("badgeDate").textContent=new Date(t).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
  if(center||Date.now()-lastUserScroll>4000){
    const y=yOf(t), top=wrap.scrollTop, h=wrap.clientHeight;
    if(center||y<top+h*0.15||y>top+h*0.85){progScroll=true;wrap.scrollTop=y-h/2}
  }
  if(!liveMode&&Date.now()-lastHash>2000){lastHash=Date.now();history.replaceState(null,"",`#cam=${encodeURIComponent($("cam").value)}&t=${Math.round(t)}`)}
}

/* ---------- Abspielen ---------- */
function seekTo(t,keepPaused){
  leaveLive();
  if(!segs.length){toast("Für diesen Tag gibt es noch keine Aufnahme");return}
  const last=segs[segs.length-1];
  if(t>last.start+last.dur&&$("day").value===ymd(new Date()))toast("Neueste Aufnahme endet um "+hms(last.start+last.dur)+" – der Upload hinkt etwas hinterher");
  let i=segs.findIndex(s=>t>=s.start&&t<s.start+s.dur), off=0;
  if(i>=0) off=(t-segs[i].start)/1000;
  else{ i=segs.findIndex(s=>s.start>t); if(i<0){i=segs.length-1;off=Math.max(0,segs[i].dur/1000-3)} else if(segs[i].start-t>1000)toast("Keine Aufnahme – nächste um "+hms(segs[i].start)) }
  play(i,off,keepPaused);
}
function play(i,off,keepPaused){
  if(i<0||i>=segs.length)return;
  const wasPaused=v.paused&&cur>=0, s=segs[i];
  if(i===cur&&v.readyState>0){v.currentTime=off;updateCursor(false);return}
  cur=i; pending={off,paused:keepPaused&&wasPaused};
  v.src=s.url; $("dl").href=s.url; markCurrent();
}
v.addEventListener("loadedmetadata",()=>{
  if(!pending)return; const p=pending; pending=null;
  v.currentTime=Math.min(p.off,Math.max(0,v.duration-0.3)); v.playbackRate=+$("speed").value;
  if(!p.paused)v.play().catch(()=>{});
  updateCursor(false); preloadNext();
});
v.addEventListener("ended",()=>{
  if(cur+1<segs.length){const gap=segs[cur+1].start-(segs[cur].start+segs[cur].dur);if(gap>5000)toast("Lücke von "+fmtDur(gap)+" übersprungen");play(cur+1,0)}
  else if(follow)toast("Warte auf neue Aufnahme …");
});
v.addEventListener("timeupdate",()=>updateCursor(false));
v.addEventListener("play",()=>$("play").textContent="❚❚ Pause");
v.addEventListener("pause",()=>$("play").textContent="▶ Abspielen");
v.addEventListener("error",()=>{if(cur>=0)toast("Segment nicht abspielbar – überspringe");if(cur+1<segs.length)play(cur+1,0)});
let preloader=null;
function preloadNext(){ if(cur+1>=segs.length)return; preloader=preloader||document.createElement("video"); preloader.preload="auto"; preloader.muted=true; preloader.src=segs[cur+1].url }

$("play").onclick=()=>{if(liveMode)return;if(cur<0&&segs.length)play(segs.length-1,0);else v.paused?v.play():v.pause()};
document.querySelectorAll("[data-skip]").forEach(b=>b.onclick=()=>skip(+b.dataset.skip));
function skip(sec){const t=nowT();if(t!=null){if(liveMode&&sec>0)return;follow=false;seekTo(t+sec*1000,!liveMode)}}
$("speed").onchange=()=>v.playbackRate=+$("speed").value;
$("fs").onclick=()=>{const e=$("vwrap");(document.fullscreenElement?document.exitFullscreen():(e.requestFullscreen||e.webkitRequestFullscreen||(()=>v.webkitEnterFullscreen&&v.webkitEnterFullscreen())).call(e))};
$("jump").onchange=()=>{const [h,m,s]=($("jump").value||"0:0:0").split(":").map(Number);follow=false;seekTo(dayStart+((h||0)*3600+(m||0)*60+(s||0))*1000)};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.code==="Space"){e.preventDefault();$("play").click()}
  else if(e.key==="ArrowLeft"){e.preventDefault();skip(e.shiftKey?-60:-10)}
  else if(e.key==="ArrowRight"){e.preventDefault();skip(e.shiftKey?60:10)}
});

/* ---------- Zeitstrahl bedienen ---------- */
function tFromEvent(e){const b=tl.getBoundingClientRect();return tOf(e.clientY-b.top)}
tl.addEventListener("click",e=>{follow=false;$("live").classList.remove("on");seekTo(tFromEvent(e))});
tl.addEventListener("mousemove",e=>{
  const t=tFromEvent(e), s=segs.find(s=>t>=s.start&&t<s.start+s.dur), p=$("prev");
  $("prevTime").textContent=hms(t)+(s?"":" · keine Aufnahme");
  if(s&&s.thumb){$("prevImg").src=s.thumb;$("prevImg").style.display="block"}else $("prevImg").style.display="none";
  p.style.display="block";
  const x=Math.max(8,e.clientX-220), y=Math.min(window.innerHeight-150,Math.max(8,e.clientY-60));
  p.style.left=x+"px"; p.style.top=y+"px";
});
tl.addEventListener("mouseleave",()=>$("prev").style.display="none");
wrap.addEventListener("scroll",()=>{if(progScroll){progScroll=false;return}lastUserScroll=Date.now()},{passive:true});
function setZoom(z){const t=nowT();zoom=Math.max(0,Math.min(ZOOMS.length-1,z));draw();if(t==null){progScroll=true;wrap.scrollTop=0}}
$("zIn").onclick=()=>setZoom(zoom+1); $("zOut").onclick=()=>setZoom(zoom-1);
window.addEventListener("resize",()=>drawActivity());

/* ---------- Tage, Kamera, Live ---------- */
$("cam").onchange=()=>{follow=false;loadDay(null,liveMode)};
$("day").onchange=()=>{follow=false;leaveLive();loadDay(null)};
$("dPrev").onclick=()=>{const i=days.indexOf($("day").value);if(i<days.length-1){$("day").value=days[i+1];$("day").onchange()}};
$("dNext").onclick=()=>{const i=days.indexOf($("day").value);if(i>0){$("day").value=days[i-1];$("day").onchange()}};
/* ---------- Live-Bild ---------- */
async function goLive(){
  let st={available:false};
  try{st=await j("api/live")}catch(e){}
  if(!st.available){toast("Kein Live-Bild – Handy ist nicht per USB an AleCast angeschlossen");return false}
  const today=ymd(new Date());
  days=withToday(days); $("day").innerHTML=days.map(d=>`<option>${d}</option>`).join("");
  $("day").value=today;
  if(loadedDay!==today) await loadDay(null,true);
  liveMode=true; follow=false; cur=-1; markCurrent(); pending=null;
  v.pause(); v.removeAttribute("src"); v.load(); v.style.display="none";
  const im=$("liveImg"); im.style.display="block"; im.src="live.mjpg?"+Date.now();
  $("live").classList.add("on"); $("liveTag").style.display="inline-block";
  $("play").textContent="● Live"; $("play").disabled=true; $("speed").disabled=true;
  clearInterval(liveTimer); liveTimer=setInterval(()=>updateCursor(false),1000); updateCursor(true);
  history.replaceState(null,"",`#cam=${encodeURIComponent($("cam").value)}`);
  return true;
}
function leaveLive(){
  if(!liveMode)return;
  liveMode=false; clearInterval(liveTimer);
  const im=$("liveImg"); im.removeAttribute("src"); im.style.display="none";
  v.style.display="block"; $("live").classList.remove("on"); $("liveTag").style.display="none";
  $("play").disabled=false; $("speed").disabled=false; $("play").textContent="▶ Abspielen";
}
$("liveImg").addEventListener("error",()=>{
  if(!liveMode||!$("liveImg").getAttribute("src"))return;
  toast("Live-Bild abgebrochen – zeige neueste Aufnahme");
  leaveLive(); if(segs.length){const l=segs[segs.length-1];seekTo(Math.max(l.start,l.start+l.dur-15000))}
});
$("live").onclick=()=>{ if(liveMode){leaveLive(); if(segs.length){const l=segs[segs.length-1];seekTo(Math.max(l.start,l.start+l.dur-15000))}} else goLive() };

/* Heute: alle 20 s neue Segmente nachladen */
setInterval(async()=>{
  if($("day").value!==ymd(new Date()))return;
  try{
    const n=await j(`api/recordings?camera=${encodeURIComponent($("cam").value)}&date=${$("day").value}`);
    if(n.length===segs.length&&n.every((s,i)=>s.motion===null===(segs[i].motion===null)))return;
    const curStart=cur>=0?segs[cur].start:null, atEnd=cur===segs.length-1&&(v.ended||v.paused&&follow);
    segs=n; cur=curStart==null?-1:segs.findIndex(s=>s.start===curStart);
    draw(false); $("info").textContent=`${segs.length} Segmente · ${fmtDur(segs.reduce((a,s)=>a+s.dur,0))} aufgenommen`;
    if(follow&&atEnd&&cur+1<segs.length)play(cur+1,0);
  }catch(e){}
},20000);

init().catch(e=>{$("empty").textContent="Fehler: "+e.message;$("empty").style.display="block"});
</script>
</body>
</html>
