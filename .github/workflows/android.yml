name: AleCorder APK bauen

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          # Signaturschlüssel liegt im Repo, damit jedes Update dieselbe Signatur trägt.
          KEYSTORE_FILE: ${{ github.workspace }}/android/keystore/alecorder.jks
          KEYSTORE_PASSWORD: "vGMXTQzDtIMobcV0s02NBBLeT5yN2Tbg"
          KEY_ALIAS: alecorder
          KEY_PASSWORD: "vGMXTQzDtIMobcV0s02NBBLeT5yN2Tbg"
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk "AleCorder-$VER.apk"
          gh release create "alecorder-v$VER" "AleCorder-$VER.apk" \
            --title "AleCorder $VER" \
            --notes "APK zum Installieren auf dem Handy. Commit: ${{ github.sha }}" \
            --latest
