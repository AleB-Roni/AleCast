name: Docker-Image bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/aleb-roni/alecast:latest
            ghcr.io/aleb-roni/alecast:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AleB-Roni/AleCast
            org.opencontainers.image.description=Android-Bildschirm per USB als RTSP-Stream
